# Disabled until the repository is published: it only runs when started by hand, so no hosted minutes are spent.
name: test
on: workflow_dispatch
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6   # 3 x the slowest job of the last green run (Windows, 115 s), rounded up
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
